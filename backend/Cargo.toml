[package]
name = "exitzero"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
exitzero-core = { path = "../crates/exitzero-core" }
axum = "0.8.9"
futures-core = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors", "fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
